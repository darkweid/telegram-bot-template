# Lints infra/ansible and previews site.yml (--check) on a GitHub-hosted runner in
# both bot modes. Path-filtered, so application changes never start it, and
# therefore not a required check: a required check that never starts blocks the
# merge.
name: Ansible

on:
  pull_request:
    paths:
      - "infra/ansible/**"
      - "!infra/ansible/**/*.md"
      - "infra/requirements/ansible.*"
      - ".github/workflows/ansible.yml"
      # The jobs run the ansible-* make targets; the generic CI never does.
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "infra/ansible/**"
      - "!infra/ansible/**/*.md"
      - "infra/requirements/ansible.*"
      - ".github/workflows/ansible.yml"
      # The jobs run the ansible-* make targets; the generic CI never does.
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: make ansible-deps

      - name: Lint
        run: make ansible-lint

      - name: Check the Docker APT key
        run: infra/ansible/tests/check_docker_key.sh

  check:
    name: Preview (--check)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: make ansible-deps

      - name: Make the runner look like a fresh server
        run: infra/ansible/tests/ci/prepare_runner.sh

      - name: Preview site.yml in both bot modes
        run: infra/ansible/tests/ci/check_mode.sh
