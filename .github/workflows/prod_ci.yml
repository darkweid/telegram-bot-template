# Production CI for the main branch. All logic lives in _ci.yml; this file
# binds it to a branch and decides the moving image tag.
name: CI (prod)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml
    with:
      # A pull request validates code; it must not publish an image.
      push_image: ${{ github.event_name == 'push' }}
      moving_tag: latest
    # Not `secrets: inherit`: CI runs third-party actions on every push and pull
    # request, so it gets only the one secret _ci.yml actually declares.
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    # The ceiling for _ci.yml: a called workflow can never hold more than the
    # job that calls it, and this block - not the workflow-level one above -
    # is what that job holds. `packages: write` is for the image push,
    # `actions: read` for the tree lookup, `pull-requests: write` for the
    # Coveralls comment of `unit-tests` (gitleaks only reads a pull request's
    # commits).
    permissions:
      contents: read
      pull-requests: write
      packages: write
      actions: read
