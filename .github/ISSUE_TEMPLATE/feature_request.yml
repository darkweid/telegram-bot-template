name: Feature request
description: Something most bots started from the template would need.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What a bot built on the template cannot do today, or does with too much code. This tracker is public; leave out tokens, `.env` values and your users' data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
