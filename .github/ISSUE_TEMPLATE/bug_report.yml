name: Bug report
description: Something in the template does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead. This tracker is public; leave out tokens, `.env` values and your users' data (names, usernames, message text).
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The commands you ran and the steps in the chat (a command, a button press, a photo), not the raw update, which carries names and message text. Describe settings by name; never paste tokens, secrets or the contents of your `.env`.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or release
      placeholder: v0.1.0 or the first 12 characters of the commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Bot mode
      options: [polling, webhook, polling and webhook (reproduces in each)]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Remove tokens, passwords, user and chat ids, names and anything your users wrote before pasting.
      render: text
