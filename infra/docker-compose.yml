# The bot and the services it needs.

name: tg-bot-template
services:
  # Every limit below comes from .env (BOT_CPUS, BOT_MEMORY, ...) with the
  # default written here, so a small box lowers them without editing this file.
  # BOT_IMAGE lets a deploy run the image CI pushed instead of building on the
  # box. Unset, every service uses the locally built tag.
  bot-builder:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
    image: ${BOT_IMAGE:-tg-bot-template-bot:latest}
    # Only builds the image; must not start a second bot when the stack comes up.
    command: ["true"]
    networks:
      - bot-network

  postgres:
    build:
      context: ..
      dockerfile: infra/postgres/Dockerfile
    image: tg-bot-template-postgres:18
    restart: always
    shm_size: 256m
    # Loopback only: an operator reaches it through an SSH tunnel to 127.0.0.1 on
    # the host, the network never does. The host side is its own variable:
    # POSTGRES_PORT is what the bot dials inside the network, and the container
    # always listens on 5432.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/18/main
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPUS:-1}'
          memory: ${POSTGRES_MEMORY:-1G}

  # Applies the migrations baked into the image the bot runs, once, before the
  # bot starts. `make migrate` runs it by hand.
  migrate:
    image: ${BOT_IMAGE:-tg-bot-template-bot:latest}
    env_file: ../.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
      bot-builder:
        condition: service_completed_successfully
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: '${MIGRATE_CPUS:-1}'
          memory: ${MIGRATE_MEMORY:-256M}

  bot:
    image: ${BOT_IMAGE:-tg-bot-template-bot:latest}
    env_file: ../.env
    restart: unless-stopped
    # Longer than SHUTDOWN_TIMEOUT_SECONDS (20 by default): SIGTERM makes the
    # bot stop taking updates and finish the ones in progress, and past this
    # period Docker kills it mid-update.
    stop_grace_period: 30s
    healthcheck:
      # /live touches no dependency: a Postgres or Redis blip must not make
      # Docker restart a bot that recovers on its own.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:${WEB_SERVER_PORT:-8080}/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bot-builder:
        condition: service_completed_successfully
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: '${BOT_CPUS:-1}'
          memory: ${BOT_MEMORY:-512M}

  # Runs background tasks: one process, up to 20 at once; scale with replicas.
  # Waits for the migrations like the bot: tasks read and write the same tables.
  worker:
    image: ${BOT_IMAGE:-tg-bot-template-bot:latest}
    env_file: ../.env
    restart: unless-stopped
    command:
      - taskiq
      - worker
      - src.main.worker:broker
      - --receiver
      - src.core.tasks.receiver:IdempotencyReceiver
      - --workers
      - "1"
      - --max-async-tasks
      - "20"
      - --wait-tasks-timeout
      - "25"
      - --no-configure-logging
    # Longer than --wait-tasks-timeout, so the worker cancels what is still
    # running before Docker kills it. A cancelled task may still be acked:
    # long work resumes through its own state (a broadcast: its resume task).
    stop_grace_period: 35s
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bot-builder:
        condition: service_completed_successfully
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: '${WORKER_CPUS:-1}'
          memory: ${WORKER_MEMORY:-512M}

  # Exactly one: taskiq has no duplicate-fire protection, N schedulers fire
  # every cron N times. It also fires the worker's delayed retries.
  scheduler:
    image: ${BOT_IMAGE:-tg-bot-template-bot:latest}
    env_file: ../.env
    restart: unless-stopped
    command:
      - taskiq
      - scheduler
      - src.main.scheduler:scheduler
      - --update-interval
      - "30"
      - --no-configure-logging
    healthcheck:
      # A Redis ping stays green while a wedged loop fires nothing; the
      # heartbeat is written by the loop itself.
      test: ["CMD", "python", "-m", "src.main.heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # No migrations to wait for: the scheduler only reads its schedule and
    # sends messages to Redis, it never opens the database.
    depends_on:
      redis:
        condition: service_healthy
      bot-builder:
        condition: service_completed_successfully
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: '${SCHEDULER_CPUS:-0.5}'
          memory: ${SCHEDULER_MEMORY:-256M}

  redis:
    image: 'redis:8.10'
    restart: unless-stopped
    # Loopback only, host port decoupled from REDIS_PORT, as for postgres above.
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    # Not the bot's env_file: that would hand Redis every secret of the stack.
    # redis-cli authenticates from REDISCLI_AUTH on its own, for the healthcheck
    # and `make redis-cli` alike, without the password in its argv. An empty
    # password would leave the instance open, so compose refuses to start.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      # Plain `redis-cli ping` exits 0 even on NOAUTH under requirepass, so a
      # broken instance reads as healthy; assert the PONG.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: ["sh", "/etc/redis/entrypoint.sh"]
    volumes:
      - ./redis.conf:/etc/redis/redis.conf:ro
      - ./redis-entrypoint.sh:/etc/redis/entrypoint.sh:ro
      - redis-data:/data
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPUS:-1}'
          memory: ${REDIS_MEMORY:-1G}

  # Webhook mode only (COMPOSE_PROFILES=webhook in .env): the one service the
  # internet reaches. infra/nginx/entrypoint.sh renders the configuration for
  # WEBHOOK_BASE_URL; the TLS server appears once certbot holds a certificate
  # (`make cert-issue`).
  nginx:
    image: nginx:1.31.6
    profiles: ["webhook"]
    restart: unless-stopped
    # Runs before the image's own entrypoint; overriding the entrypoint drops
    # the image's command, so it is repeated here.
    entrypoint: ["sh", "/etc/nginx/bot/entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    # Not the bot's env_file: nginx needs these four, none of them a secret.
    environment:
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      WEBHOOK_PATH: ${WEBHOOK_PATH:-/webhook/telegram}
      WEB_SERVER_PORT: ${WEB_SERVER_PORT:-8080}
      TELEGRAM_ALLOWED_SUBNETS: ${TELEGRAM_ALLOWED_SUBNETS:-149.154.160.0/20,91.108.4.0/22}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The directory, never its files one by one: `git pull` on the box
      # replaces a changed file with a new inode, and a single-file bind mount
      # stays on the old one, so a reload would serve the previous
      # configuration while `nginx -t` passed the new one.
      - ./nginx:/etc/nginx/bot:ro
      # The bot upstream's servers, rewritten by infra/deploy/deploy.sh while it
      # rolls the bot. A volume, so the pin outlives a recreation of nginx.
      - nginx-upstream:/etc/nginx/upstream
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      bot:
        condition: service_healthy
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: '${NGINX_CPUS:-0.5}'
          memory: ${NGINX_MEMORY:-128M}

  # Tries to renew the certificate twice a day (a no-op until it is due) into
  # the volume nginx reads; nginx reloads every 6 hours and picks the new one
  # up, so neither container needs the Docker socket. `make cert-issue` issues
  # the first certificate.
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: ["webhook"]
    restart: unless-stopped
    # `sleep & wait` lets the trap run on SIGTERM at once; a foreground sleep
    # would hold `docker compose down` for the whole grace period.
    entrypoint:
      - sh
      - -c
      - trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: '${CERTBOT_CPUS:-0.5}'
          memory: ${CERTBOT_MEMORY:-256M}

volumes:
  postgres-data:
    name: tg-bot-template-postgres-data
  redis-data:
    name: tg-bot-template-redis-data
  nginx-upstream:
    name: tg-bot-template-nginx-upstream
  certbot-certs:
    name: tg-bot-template-certbot-certs
  certbot-webroot:
    name: tg-bot-template-certbot-webroot

networks:
  bot-network:
    name: tg-bot-template-network
    driver: bridge
