# The bot and the services it needs.

name: tg-bot-template
services:
  # BOT_IMAGE lets a deploy run the image CI pushed instead of building on the
  # box. Unset, every service uses the locally built tag.
  bot-builder:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
    image: ${BOT_IMAGE:-tg-bot-template-bot:latest}
    # Only builds the image; must not start a second bot when the stack comes up.
    command: ["true"]
    networks:
      - bot-network

  postgres:
    build:
      context: ..
      dockerfile: infra/postgres/Dockerfile
    image: tg-bot-template-postgres:18
    restart: always
    shm_size: 256m
    # Loopback only: an operator reaches it through an SSH tunnel to 127.0.0.1 on
    # the host, the network never does. The host side is its own variable:
    # POSTGRES_PORT is what the bot dials inside the network, and the container
    # always listens on 5432.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/18/main
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Applies the migrations baked into the image the bot runs, once, before the
  # bot starts. `make migrate` runs it by hand.
  migrate:
    image: ${BOT_IMAGE:-tg-bot-template-bot:latest}
    env_file: ../.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
      bot-builder:
        condition: service_completed_successfully
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  bot:
    image: ${BOT_IMAGE:-tg-bot-template-bot:latest}
    env_file: ../.env
    restart: unless-stopped
    # Longer than SHUTDOWN_TIMEOUT_SECONDS (20 by default): SIGTERM makes the
    # bot stop taking updates and finish the ones in progress, and past this
    # period Docker kills it mid-update.
    stop_grace_period: 30s
    healthcheck:
      # /live touches no dependency: a Postgres or Redis blip must not make
      # Docker restart a bot that recovers on its own.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:${WEB_SERVER_PORT:-8080}/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bot-builder:
        condition: service_completed_successfully
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  redis:
    image: 'redis:8.10'
    restart: unless-stopped
    # Loopback only, host port decoupled from REDIS_PORT, as for postgres above.
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    # Not the bot's env_file: that would hand Redis every secret of the stack.
    # redis-cli authenticates from REDISCLI_AUTH on its own, for the healthcheck
    # and `make redis-cli` alike, without the password in its argv. An empty
    # password would leave the instance open, so compose refuses to start.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      # Plain `redis-cli ping` exits 0 even on NOAUTH under requirepass, so a
      # broken instance reads as healthy; assert the PONG.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: ["sh", "/etc/redis/entrypoint.sh"]
    volumes:
      - ./redis.conf:/etc/redis/redis.conf:ro
      - ./redis-entrypoint.sh:/etc/redis/entrypoint.sh:ro
      - redis-data:/data
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

volumes:
  postgres-data:
    name: tg-bot-template-postgres-data
  redis-data:
    name: tg-bot-template-redis-data

networks:
  bot-network:
    name: tg-bot-template-network
    driver: bridge
