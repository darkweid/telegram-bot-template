# Copied into conf.d by entrypoint.sh, so it is loaded in the http context and
# covers every server, the default ones that drop unknown hosts included.
server_tokens off;

# Telegram posts updates as JSON well under this; a larger body is not an update.
client_max_body_size 1m;

# 1 for an address Telegram delivers webhooks from. The subnets come from
# TELEGRAM_ALLOWED_SUBNETS, written by entrypoint.sh.
geo $from_telegram {
    default 0;
    include /etc/nginx/generated/telegram_subnets.inc;
}

# 1 for a private address: a monitor on the provider's private network, a
# container on the compose network. The bridge gateway is excluded (written by
# entrypoint.sh): Docker forwards the published-port connections it proxies,
# every IPv6 client among them, from that address, so allowing it would open
# the probes to the internet. geo picks the most specific match, so the /32
# wins over 172.16.0.0/12.
geo $from_private_network {
    default 0;
    127.0.0.1 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    include /etc/nginx/generated/bridge_gateway.inc;
}

# The bot containers nginx routes to, from bot_upstream.inc: written at start
# by entrypoint.sh and rewritten by infra/deploy/deploy.sh while it rolls the
# bot. `resolve` follows a container that restarts on a new address without a
# reload.
upstream bot_upstream {
    zone bot_upstream 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    include /etc/nginx/upstream/bot_upstream.inc;
    keepalive 16;
    # Shorter than aiohttp's keep-alive (75s): an idle connection is always
    # closed by nginx first, never by the bot while nginx writes a request on it.
    keepalive_timeout 5s;
}
