# save <seconds> <changes>: RDB snapshot rules
save 600 1
save 300 10
save 60 10000

dbfilename dump.rdb
dir /data

# This instance holds the bot's FSM state (a user's step in a multi-step dialog
# and its data) and the per-chat event-isolation locks, the taskiq queue and
# the scheduler heartbeat (REDIS_TASKS_DATABASE), and the cache. A crash
# between RDB snapshots would drop users out of their dialogs and lose queued
# tasks. AOF caps that loss at ~1s of writes; `everysec` keeps the fsync cost
# off the update handling.
appendonly yes
appendfsync everysec

# A kill that lands mid-write leaves a malformed command in the AOF tail,
# and `aof-load-truncated` only covers a cleanly cut one: without this the
# instance refuses to start at all, taking the bot with it.
# The tail is at most the last second of writes, which `everysec` already
# accepts losing. The value is a byte count; the unit suffixes other size
# options take are rejected here.
aof-load-corrupt-tail-max-size 65536

# Cap well under the 1G container limit so an RDB/AOF-rewrite fork has headroom
# and cannot OOM-kill the instance. noeviction because evicting FSM state
# silently drops users out of their dialogs and evicting the task stream drops
# queued tasks: refuse writes instead.
maxmemory 512mb
maxmemory-policy noeviction
