# Alembic settings; the database URL comes from src.main.config (migrations/env.py).

[alembic]
script_location = migrations

# Date-prefixed names keep the versions directory in creation order.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os

[post_write_hooks]
# Run on every generated revision script, so it passes the pre-commit hooks as is.
hooks = ruff_check, black

# ruff ships a binary, not a console_scripts entry point, so it runs as `python -m ruff`.
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
